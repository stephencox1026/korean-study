<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Korean Connections — group Korean words into four categories. Daily puzzle with Group, One Shot, and Practice modes.">
  <title>Korean Connections</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="nyt.css">
</head>
<body>
  <!-- SHARED SHELL: header -->
  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title">Korean Connections</h1>
      <p id="puzzle-label" class="puzzle-label"></p>
    </div>
    <nav class="mode-nav" aria-label="Game mode">
      <a href="../index.html" class="mode-link">Flashcards</a>
      <span class="mode-divider" aria-hidden="true">|</span>
      <a href="index.html" class="mode-link is-active">Group</a>
      <span class="mode-divider" aria-hidden="true">|</span>
      <a href="one-shot.html" class="mode-link">One Shot</a>
      <span class="mode-divider" aria-hidden="true">|</span>
      <a href="practice.html" class="mode-link">Practice</a>
      <span class="mode-divider" aria-hidden="true">|</span>
      <a href="../privacy.html" class="mode-link">Privacy</a>
    </nav>
  </header>

  <!-- MODE: solved category bars (hidden until correct groups) -->
  <section id="play-top" class="section">
    <div class="board-width">
      <div id="solved-groups" class="solved-groups"></div>
    </div>
  </section>

  <hr class="section-divider" aria-hidden="true">

  <!-- SHARED SHELL: pool section -->
  <section id="pool" class="section">
    <div class="board-width">
      <p class="pool-hint">Select Four Tiles, Then Submit</p>
      <div id="game-toast" class="game-toast" hidden role="status" aria-live="polite"></div>
      <div id="tile-grid" class="tile-grid"></div>
      <div class="mistakes-panel" id="mistakes-panel" aria-live="polite">
        <p class="mistakes-label">Mistakes Remaining</p>
        <div class="mistakes-dots" id="mistakes-dots" aria-hidden="true">
          <span class="mistake-dot"></span>
          <span class="mistake-dot"></span>
          <span class="mistake-dot"></span>
          <span class="mistake-dot"></span>
        </div>
      </div>
      <div class="pool-controls">
        <button type="button" id="clear-wrong-btn" class="btn-pill pressable">Clear</button>
        <button type="button" id="submit-btn" class="btn-pill pressable">Submit</button>
        <button type="button" id="show-answer-btn" class="btn-pill pressable">Show Answer</button>
        <button type="button" id="new-puzzle-btn" class="btn-pill pressable">New Puzzle</button>
      </div>
    </div>
  </section>

  <!-- SHARED SHELL: win modal -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="results-modal">
      <button type="button" id="modal-close-btn" class="modal-close-btn pressable" aria-label="Close">×</button>
      <h3 class="modal-title">You solved it!</h3>
      <p class="modal-sub">All 16 words sorted correctly.</p>
      <button type="button" id="play-again-btn" class="btn-pill pressable ready">Play Again</button>
    </div>
  </div>

  <script src="daily.js" defer></script>
  <script src="puzzles/prototype-01.js" defer></script>
  <script src="nyt.js" defer></script>
</body>
</html>
